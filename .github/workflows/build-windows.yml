name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ release_7_00 ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 5.15.2 + MinGW 8.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          cache: true

      - name: Add MinGW to PATH
        shell: bash
        run: echo "${IQTA_TOOLS}/mingw810_64/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        shell: bash
        run: |
          g++ --version
          qmake -v
          mingw32-make --version

      - name: Build
        shell: bash
        run: |
          mkdir build_ci
          cd build_ci
          qmake ../vesc_tool.pro CONFIG+=release
          mingw32-make -j4

      - name: Collect and deploy Qt DLLs
        shell: bash
        run: |
          set -e

          QT_PREFIX="$(qmake -query QT_INSTALL_PREFIX)"
          echo "Stripping Qt binaries in $QT_PREFIX"
          find "$QT_PREFIX" -name "*.dll" -exec strip -s {} + 2>/dev/null || true

          mkdir -p dist
          EXE=$(find build_ci -name "vesc_tool*.exe" | head -n 1)
          if [ -z "$EXE" ]; then
            echo "No exe found in build_ci"
            exit 1
          fi
          cp "$EXE" dist/
          EXE_NAME=$(basename "$EXE")
          echo "Built exe: $EXE"

          windeployqt --release --verbose 2 --qmldir . "dist/$EXE_NAME"

          echo "--- dist content ---"
          ls -R dist | head -n 80

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesc_tool-windows
          path: dist/